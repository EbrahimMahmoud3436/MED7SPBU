    let generatedAppIconUrl = '';
    function initPwaAndServiceWorker() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1A2421';
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 110);
        ctx.fill();

        const svgString = SPBU_SVG_RAW
          .replace('<svg ', '<svg width="380" height="410" fill="#DCE7DF" color="#DCE7DF" ')
          .replace(/fill="#FFFFFF"/g, 'fill="#1A2421"');
        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function () {
          ctx.drawImage(img, 66, 51, 380, 410);
          URL.revokeObjectURL(url);
          generatedAppIconUrl = canvas.toDataURL('image/png');

          document.getElementById('dynamic-favicon').href = generatedAppIconUrl;
          document.getElementById('dynamic-apple-icon').href = generatedAppIconUrl;

          const manifestObj = {
            name: "Med7 SPBU — General Medicine Workspace",
            short_name: "Med7 SPBU",
            description: "Study & Schedule Workspace for Med7 SPBU General Medicine",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#F3F5F0",
            theme_color: "#245940",
            icons: [
              { src: generatedAppIconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
            ]
          };
          const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);
        };
        img.src = url;

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('notificationclick', function(event) {
              event.notification.close();
              event.waitUntil(
                clients.matchAll({ type: 'window', includeUncontrolled: true }).then(windowClients => {
                  if (windowClients.length > 0) return windowClients[0].focus();
                  return clients.openWindow('/');
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (e) {}
    }

    function getNotificationStatus() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    }

    async function requestDeviceNotificationPermission() {
      if (!('Notification' in window)) {
        showToast('Use Chrome on Android/PC or Add to Home Screen on iPhone (iOS 16.4+) to enable system notifications.', 'System Info');
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          dispatchNativeNotification(
            'Med7 SPBU Notifications Active ✅',
            'You will now receive instant alerts for Pomodoro timers, new lectures, and university announcements!'
          );
        } else {
          showToast('Notification permission was not granted. Please allow it in browser settings.', 'Permission Needed');
        }
        render();
      } catch (e) {
        showToast('Tap Lock icon in address bar → Permissions → Allow Notifications.', 'Enable Notifications');
      }
    }

    function dispatchNativeNotification(title, body, targetGroup = 'All groups') {
      if (
        targetGroup !== 'All groups' &&
        state &&
        state.profile &&
        targetGroup !== state.profile.subgroup
      ) {
        return;
      }

      playAlertChime();
      if (navigator.vibrate) {
        try { navigator.vibrate([200, 100, 200]); } catch (e) {}
      }

      showToast(body, title);

      if ('Notification' in window && Notification.permission === 'granted') {
        const options = {
          body: body,
          icon: generatedAppIconUrl || undefined,
          badge: generatedAppIconUrl || undefined,
          vibrate: [200, 100, 200],
          tag: 'med7-' + Date.now()
        };
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then(reg => {
            if (reg && reg.showNotification) {
              reg.showNotification(title, options);
            } else {
              new Notification(title, options);
            }
          }).catch(() => {
            try { new Notification(title, options); } catch (e) {}
          });
        } else {
          try { new Notification(title, options); } catch (e) {}
        }
      }
    }

    async function syncFromTelegramBot(silent = false) {
      if (!state.telegramBotToken) {
        if (!silent) showToast('Add your Bot Token in Owner Mode first', 'Telegram Sync');
        return;
      }
      try {
        const url = `https://api.telegram.org/bot${state.telegramBotToken.trim()}/getUpdates?offset=${state.lastUpdateId + 1}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) return;

        let newItemsCount = 0;
        for (const upd of data.result) {
          state.lastUpdateId = Math.max(state.lastUpdateId, upd.update_id);
          const msg = upd.message || upd.channel_post;
          if (!msg) continue;

          let topicName = '';
          if (msg.reply_to_message && msg.reply_to_message.forum_topic_created) {
            topicName = msg.reply_to_message.forum_topic_created.name.toLowerCase();
          }
          const text = (msg.text || msg.caption || '').trim();

          if (msg.document) {
            const fileName = msg.document.file_name || 'Lecture_File.pdf';
            const ext = fileName.split('.').pop().toUpperCase();
            const sizeMb = msg.document.file_size ? (msg.document.file_size / (1024 * 1024)).toFixed(1) + ' MB' : '2.0 MB';

            if (topicName.includes('schedule') || fileName.toLowerCase().includes('week') || fileName.toLowerCase().includes('schedule')) {
              state.uniContent.Schedules.unshift({
                id: 'u_' + Date.now() + Math.random(),
                title: `New Schedule PDF: ${fileName}`,
                desc: text || 'Synced automatically from #Schedules.'
              });
              state.notifications.unshift({
                id: 'n_' + Date.now() + Math.random(),
                title: '📅 New Schedule PDF Uploaded',
                body: `${fileName} is now live in University Schedules.`,
                time: 'Just now',
                unread: true
              });
              dispatchNativeNotification('📅 New Schedule PDF Uploaded', `${fileName} is now available in your Med7 SPBU workspace.`);
              newItemsCount++;
            } else {
              let matchedSubject = 'Clinical Anatomy';
              for (const s of state.subjects) {
                if (topicName.includes(s.topicKey) || text.toLowerCase().includes(s.topicKey) || fileName.toLowerCase().includes(s.topicKey)) {

                  s.resourcesCount += 1;
                  break;

              state.library.unshift({

                type: ext,

                badge: matchedSubject.charAt(0).toUpperCase(),

    function playAlertChime() {
      if (!state.timerConfig.alertSound) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.35);
        });
      } catch (e) {}
    }

    function setTimerTab(tabMode) {
      clearInterval(timerInterval);
      timerRunning = false;
      timerActiveView = false;
      state.timerConfig.mode = tabMode;
      saveState();
      render();
    }

    function adjustTimerValue(key, delta, minVal, maxVal) {
      let current = state.timerConfig[key] || minVal;
      current = Math.max(minVal, Math.min(maxVal, current + delta));
      state.timerConfig[key] = current;
      saveState();
      render();
    }

    function toggleAlertSound() {
      state.timerConfig.alertSound = !state.timerConfig.alertSound;
      saveState();
      if (state.timerConfig.alertSound) playAlertChime();
      render();
    }

    function startTimerWidget() {
      const cfg = state.timerConfig;
      timerActiveView = true;
      timerRunning = true;

      if (cfg.mode === 'Countdown') {
        timerSeconds = cfg.countdownMin * 60;
      } else {
        pomoCurrentRound = 1;
        pomoPhase = 'Focus';
        timerSeconds = cfg.focusMin * 60;
      }

      runTimerLoop();
      render();
    }

    function runTimerLoop() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!timerRunning) return;
        const cfg = state.timerConfig;

        if (timerSeconds > 0) {
          timerSeconds--;
          updateLiveTimerDom();
        } else {
          if (cfg.mode === 'Countdown') {
            clearInterval(timerInterval);
            timerRunning = false;
            timerActiveView = false;
            state.studyBlocksCompleted = (state.studyBlocksCompleted || 9) + 1;
            state.notifications.unshift({
              id: 'n_' + Date.now(),
              title: '⏱️ Countdown Completed!',
              body: `You completed your ${cfg.countdownMin}-minute study session. +1 Study Block logged!`,
              time: 'Just now',
              unread: true
            });
            saveState();
            dispatchNativeNotification(
              '⏱️ Countdown Finished!',
              `Great job, ${state.profile.name}! Your ${cfg.countdownMin} min study block is complete.`
            );
            render();
          } else {
            handlePomodoroTransition();
          }
        }
      }, 1000);
    }

    function handlePomodoroTransition() {
      const cfg = state.timerConfig;
      if (pomoPhase === 'Focus') {
        state.studyBlocksCompleted = (state.studyBlocksCompleted || 9) + 1;
        saveState();
        if (pomoCurrentRound >= cfg.rounds) {
          clearInterval(timerInterval);
          timerRunning = false;
          timerActiveView = false;
          dispatchNativeNotification(
            '🏆 Pomodoro Goal Reached!',
            `All ${cfg.rounds} Focus rounds completed! Progress updated in your weekly tracker.`
          );
          render();
          return;
        }
        if (pomoCurrentRound % 4 === 0) {
          pomoPhase = 'Long Break';
          timerSeconds = cfg.longBreakMin * 60;
          dispatchNativeNotification(
            '🌟 4 Focus Rounds Complete!',
            `Time for a ${cfg.longBreakMin}-minute Long Break.`
          );
        } else {
          pomoPhase = 'Short Break';
          timerSeconds = cfg.shortBreakMin * 60;
          dispatchNativeNotification(
            `☕ Focus Round ${pomoCurrentRound} Done!`,
            `Take a ${cfg.shortBreakMin}-minute Short Break.`
          );
        }
      } else {
        pomoCurrentRound++;
        pomoPhase = 'Focus';
        timerSeconds = cfg.focusMin * 60;
        dispatchNativeNotification(
          `🔥 Break Over — Round ${pomoCurrentRound}/${cfg.rounds}`,
          `Starting your ${cfg.focusMin}-minute Focus session now!`
        );
      }
      render();
    }

    function pauseResumeTimer() {
      timerRunning = !timerRunning;
      render();
    }

    function stopAndResetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerActiveView = false;
      render();

    function formatClock(sec) {
      const hrs = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
      const secs = (sec % 60).toString().padStart(2, '0');
      return hrs > 0 ? `${hrs}:${mins}:${secs}` : `${mins}:${secs}`;
    }

      const el = document.getElementById('live-clock-digits');
      if (el) el.textContent = formatClock(timerSeconds);

    function selectSetupGroup(grp) {
      const nameInput = document.getElementById('setup-name');

      saveState();
      render();
    }

    function goToSetupStep2() {
      const nameInput = document.getElementById('setup-name');
      state.profile.name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'abdo';
      state.onboardingStep = 'setup2';
      saveState();
      render();

    function finishOnboarding() {
      const idInput = document.getElementById('setup-demoid');
      if (idInput && idInput.value.trim()) state.profile.demoId = idInput.value.trim();
      state.onboardingStep = 'done';
      state.activeTab = 'home';
      saveState();
      showToast('Signed in as ' + state.profile.name + ' (' + state.profile.subgroup + ')', 'Welcome');
      render();
    }

    // ==========================================
    // HOME TAB
    // ==========================================
    function calculateDaysLeft(dateStr) {
      const today = new Date('2026-10-31T00:00:00');
      const target = new Date(dateStr + 'T00:00:00');
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      return diff >= 0 ? diff : 0;
    }

    function renderHome() {
      const todayTasks = state.tasks.filter(t => t.dueGroup === 'TODAY');
      const completedToday = todayTasks.filter(t => t.completed).length;
      const blocksDone = state.studyBlocksCompleted || 9;
      const blocksTotal = state.studyBlocksTarget || 18;
      const weekPercent = Math.min(100, Math.round((blocksDone / blocksTotal) * 100));
      const tomorrowTask = state.tasks.find(t => !t.completed && t.dueGroup !== 'TODAY') || state.tasks[0];
      const myEvents = state.calendar.filter(e => e.group === 'All groups' || e.group === state.profile.subgroup);
      const nextLecture = myEvents[0] || state.calendar[0];

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 space-y-6">
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-widest text-[#3A5A48] dark:text-[#88B899]">

              ${(state.exams || []).map(ex => {

                return `

                      <div class="flex items-center justify-between gap-2 mb-1">

    function deleteExam(id) {
      if (!state.ownerMode) return;
      state.exams = state.exams.filter(e => e.id !== id);
      saveState();
      render();
    }

          <div class="bg-card border rounded-2xl p-5 flex items-center justify-between">
            <div>
              <p class="text-[10px] font-mono uppercase tracking-wider text-gray-400">SPBU-GM 2ND YEAR • ${state.profile.groupLabel.toUpperCase()}</p>
              <h3 class="text-lg font-bold mt-1">General Medicine — ${state.profile.subgroup}</h3>
              <p class="text-xs text-gray-500 mt-0.5">42 study members • ${state.subjects.length} subjects • Auto-Bridge Active</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-card border flex items-center justify-center p-1 overflow-hidden shrink-0">
              ${getSpbuLogoHtml("w-10 h-10")}
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-base">Subjects</h3>
              <span class="text-xs text-gray-500 font-mono">${state.subjects.length} active</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${state.subjects.map(sub => `
                <div onclick="openSubjectModal('${sub.id}')" class="bg-card border rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-[#2C6E49] hover:shadow-sm transition group">
                  <div class="flex items-start gap-3 pr-2">
                    <span class="w-8 h-8 rounded-lg bg-[#DCE7DF] dark:bg-[#253932] text-[#214E38] dark:text-[#A3D9B5] font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">
                      ${sub.code}
                    </span>
                    <div>
                      <h4 class="font-semibold text-sm leading-snug group-hover:text-[#2C6E49] dark:group-hover:text-[#98C9A3] transition">${sub.title}</h4>
                      <p class="text-xs text-gray-500 font-mono mt-1">${sub.category} • ${sub.resourcesCount} resources</p>
                    </div>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 shrink-0"></i>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h3 class="font-bold text-base">University content</h3>
              ${state.ownerMode ? `
                <button onclick="openAddUniContentModal()" class="text-xs px-3 py-1.5 rounded-lg bg-[#245940] text-white font-semibold">
                  + Add ${state.uniSubTab.slice(0, -1)} (Owner)
                </button>
              ` : `<span class="text-[11px] font-mono text-gray-400">Synced Content</span>`}
            </div>

            <div class="bg-[#E8ECE6] dark:bg-[#16201D] p-1 rounded-xl inline-flex gap-1">
              ${subTabs.map(st => `
                <button onclick="state.uniSubTab='${st}'; saveState(); render();" class="px-4 py-1.5 rounded-lg text-xs font-medium transition ${state.uniSubTab === st ? 'bg-card shadow-sm text-gray-900 dark:text-white font-semibold' : 'text-gray-600 dark:text-gray-400'}">
                  ${st}
                </button>
              `).join('')}
            </div>

            <div class="space-y-2.5">
              ${currentItems.map(item => `
                <div class="bg-card border rounded-2xl p-4 flex items-start justify-between gap-3">
                  <div class="flex items-start gap-3">
                    <div class="w-9 h-9 rounded-xl bg-[#DCE7DF] dark:bg-[#253932] text-[#214E38] dark:text-[#A3D9B5] flex items-center justify-center shrink-0">
                      <i data-lucide="calendar-check" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <h4 class="font-semibold text-sm">${item.title}</h4>

    function deleteUniContent(id) {
      if (!state.ownerMode) return;
      state.uniContent[state.uniSubTab] = state.uniContent[state.uniSubTab].filter(i => i.id !== id);
      saveState();
      render();
    }

    // ==========================================
    // TASKS TAB (WITH COUNTDOWN & POMODORO)
    // ==========================================
    function renderTasks() {
      const filters = ['All tasks', 'To-do', 'Completed'];
      let filtered = state.tasks;
      if (state.taskFilter === 'To-do') filtered = state.tasks.filter(t => !t.completed);
      if (state.taskFilter === 'Completed') filtered = state.tasks.filter(t => t.completed);

      const groups = {};
      filtered.forEach(t => {
        if (!groups[t.dueGroup]) groups[t.dueGroup] = [];
        groups[t.dueGroup].push(t);
      });

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 space-y-6">
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-widest text-[#3A5A48] dark:text-[#88B899]">PERSONAL PLANNER & FOCUS</p>
            <h2 class="text-3xl font-display font-bold mt-1">Tasks</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Small, visible steps and focused study sessions for a full week.</p>
          </div>

          ${renderThemedTimerWidget()}

          <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
            <div class="flex items-center gap-1.5 bg-[#E8ECE6] dark:bg-[#16201D] p-1 rounded-xl">
              ${filters.map(f => `
                <button onclick="state.taskFilter='${f}'; saveState(); render();" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${state.taskFilter === f ? 'bg-card shadow-sm font-semibold' : 'text-gray-600 dark:text-gray-400'}">
                  ${f}
                </button>
              `).join('')}
            </div>
            <button onclick="openAddTaskModal('TODAY')" class="px-4 py-2 rounded-xl bg-[#245940] hover:bg-[#1B4531] text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition">
              <i data-lucide="plus" class="w-4 h-4"></i> Add task
            </button>
          </div>

          <div class="space-y-6">
            ${Object.keys(groups).length === 0 ? `
              <div class="bg-card border rounded-2xl p-8 text-center text-sm text-gray-500">
                No tasks in "${state.taskFilter}". Click "+ Add task" to create one.
              </div>
            ` : Object.entries(groups).map(([grpName, items]) => `
              <div class="space-y-2">
                <div class="flex items-center justify-between text-[11px] font-mono uppercase tracking-wider text-gray-400 px-1">
                  <span>${grpName}</span>
                  <span>${items.length} ITEMS</span>
                </div>
                <div class="space-y-2">
                  ${items.map(t => `
                    <div class="bg-card border rounded-2xl p-4 flex items-center justify-between gap-3 hover:border-[#2C6E49] transition">
                      <div onclick="toggleTask('${t.id}')" class="flex items-start gap-3 flex-1 cursor-pointer">
                        <div class="mt-0.5 w-5 h-5 rounded-md border ${t.completed ? 'bg-[#2C6E49] border-[#2C6E49] text-white' : 'border-gray-300 dark:border-gray-600'} flex items-center justify-center shrink-0">
                          ${t.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                        </div>
                        <div>
                          <div class="text-sm font-semibold ${t.completed ? 'line-through text-gray-400' : ''}">${t.title}</div>
                          <div class="text-xs text-gray-500 font-mono mt-0.5">${t.subject}</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <span class="text-xs px-2.5 py-1 rounded-lg bg-[#F3F5F0] dark:bg-[#253932] text-gray-600 dark:text-gray-300 font-medium">
                          ${t.completed ? 'Done' : t.dueLabel}
                        </span>
                        <button onclick="deleteTask('${t.id}')" class="text-gray-400 hover:text-red-500 p-1">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </main>
      `;
    }

    function toggleTask(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveState();
        render();
      }
    }

    function deleteTask(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      saveState();
      showToast('Task removed');
      render();
    }

    // ==========================================
    // CALENDAR TAB (OPENING https://lms.spbu.ru/moodle/?redirect=0)
    // ==========================================
    function renderCalendar() {
      const grpFilters = ['My group', 'All groups', 'Group A', 'Group B'];
      const currentDayObj = WEEK5_DAYS.find(d => d.num === state.selectedDay) || WEEK5_DAYS[0];

      let events = state.calendar.filter(e => e.day === state.selectedDay);
      if (state.calendarFilter === 'My group') {
        events = events.filter(e => e.group === 'All groups' || e.group === state.profile.subgroup);
      } else if (state.calendarFilter === 'Group A' || state.calendarFilter === 'Group B') {
        events = events.filter(e => e.group === 'All groups' || e.group === state.calendarFilter);
      }

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 space-y-6">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <p class="text-[11px] font-semibold uppercase tracking-widest text-[#3A5A48] dark:text-[#88B899]">SPBU-GM 2ND YEAR • WEEK 5 SCHEDULE</p>
              <h2 class="text-3xl font-display font-bold mt-1">Calendar</h2>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Showing ${state.calendarFilter === 'My group' ? state.profile.subgroup : state.calendarFilter} • ${currentDayObj.fullDate}</p>
            </div>
            ${state.ownerMode ? `
              <button onclick="openAddEventModal()" class="px-3.5 py-2 rounded-xl bg-[#245940] text-white text-xs font-semibold flex items-center gap-1 shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> Add event (Owner)
              </button>
            ` : ''}
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs px-3 py-1.5 rounded-xl bg-[#E8ECE6] dark:bg-[#16201D] text-gray-600 dark:text-gray-300 font-medium">
              Profile: ${state.profile.subgroup}
            </span>
            ${grpFilters.map(gf => `
              <button onclick="state.calendarFilter='${gf}'; saveState(); render();" class="text-xs px-3.5 py-1.5 rounded-xl border transition ${state.calendarFilter === gf ? 'bg-card font-semibold border-[#2C6E49] shadow-sm' : 'border-transparent text-gray-500 hover:text-gray-800'}">
                ${gf}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-7 gap-2">
            ${WEEK5_DAYS.map(d => {
              const active = state.selectedDay === d.num;
              return `
                <button onclick="state.selectedDay='${d.num}'; saveState(); render();" class="py-3 rounded-2xl flex flex-col items-center justify-center transition ${active ? 'bg-[#1A2421] text-white shadow-md' : 'bg-card border hover:border-[#2C6E49]'}">
                  <span class="text-[10px] font-mono uppercase ${active ? 'text-gray-300' : 'text-gray-400'}">${d.name}</span>
                  <span class="mt-1 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${active ? 'bg-[#C5DF56] text-[#1A2421]' : ''}">
                    ${d.num}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="space-y-3">
            ${events.length === 0 ? `
              <div class="bg-card border rounded-2xl p-8 text-center text-sm text-gray-500">
                No lectures or practicals scheduled for this day.
              </div>
            ` : events.map(ev => `
              <div class="flex items-start gap-3 sm:gap-4">
                <span class="text-[11px] font-mono text-gray-500 pt-4 w-24 shrink-0">${ev.time}</span>
                <div class="flex-1 bg-card border rounded-2xl p-4 space-y-3 shadow-sm">
                  <div class="flex items-start justify-between gap-3">
                    <div>
                      <h4 class="font-semibold text-sm">${ev.title}</h4>
                      <p class="text-xs text-gray-500 font-mono mt-1">${ev.subtitle}</p>
                    </div>
                    <span class="text-[11px] px-2.5 py-1 rounded-full bg-[#DCE7DF] dark:bg-[#253932] text-[#214E38] dark:text-[#A3D9B5] font-medium shrink-0">
                      ${ev.group}
                    </span>
                  </div>
                  <div class="pt-2 border-t border-gray-100 dark:border-gray-800 flex flex-wrap items-center justify-between gap-2">
                    ${ev.isOnline ? `
                      <a href="${SPBU_LMS_URL}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-xl bg-[#245940] text-white hover:opacity-90 transition">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> SPbU Moodle Portal (lms.spbu.ru)
                      </a>
                    ` : `
                      <span class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-xl bg-[#F3F5F0] dark:bg-[#253932] text-[#214E38] dark:text-[#A3D9B5]">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${ev.locationGuide || ev.subtitle}
                      </span>
                    `}
                    ${state.ownerMode ? `<button onclick="deleteEvent('${ev.id}')" class="text-xs text-red-500 hover:underline">Delete (Owner)</button>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </main>
      `;
    }

    function deleteEvent(id) {
      if (!state.ownerMode) return;
      state.calendar = state.calendar.filter(e => e.id !== id);
      saveState();
      showToast('Event deleted');
      render();
    }

    // ==========================================
    // LIBRARY TAB
    // ==========================================
    function renderLibrary() {
      const q = (state.librarySearch || '').toLowerCase();
      let filtered = state.library.filter(f =>
        f.title.toLowerCase().includes(q) || f.subject.toLowerCase().includes(q)
      );
      if (state.libraryFilter === 'Starred') {
        filtered = filtered.filter(f => f.starred);
      }

      const grouped = {};
      filtered.forEach(f => {
        if (!grouped[f.subject]) grouped[f.subject] = [];
        grouped[f.subject].push(f);
      });

      const starredCount = state.library.filter(f => f.starred).length;

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 space-y-6">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <p class="text-[11px] font-semibold uppercase tracking-widest text-[#3A5A48] dark:text-[#88B899]">YOUR STUDY SHELF</p>
              <h2 class="text-3xl font-display font-bold mt-1">Library</h2>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Pin high-yield files with ⭐ and preview PDFs directly inside the app.</p>
            </div>
            ${state.ownerMode ? `
              <button onclick="openAddFileModal()" class="px-4 py-2 rounded-xl bg-[#245940] text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                <i data-lucide="upload" class="w-4 h-4"></i> Upload file (Owner)
              </button>
            ` : ''}
          </div>

          <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex items-center gap-1.5 bg-[#E8ECE6] dark:bg-[#16201D] p-1 rounded-xl shrink-0">
              <button onclick="state.libraryFilter='All'; saveState(); render();" class="px-3.5 py-2 rounded-lg text-xs font-medium transition ${state.libraryFilter === 'All' ? 'bg-card shadow-sm font-semibold' : 'text-gray-600 dark:text-gray-400'}">
                All Files (${state.library.length})
              </button>
              <button onclick="state.libraryFilter='Starred'; saveState(); render();" class="px-3.5 py-2 rounded-lg text-xs font-medium transition ${state.libraryFilter === 'Starred' ? 'bg-card shadow-sm font-semibold text-amber-600' : 'text-gray-600 dark:text-gray-400'}">
                ⭐ High-Yield (${starredCount})
              </button>
            </div>
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value="${state.librarySearch}"
                oninput="state.librarySearch = this.value; render();"
                placeholder="Search subjects or files..."
                class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-card border text-sm focus:outline-none focus:ring-2 focus:ring-[#2C6E49]"
              />
            </div>
          </div>

          <div class="space-y-6">
            ${Object.entries(grouped).map(([subj, files]) => `
              <div class="space-y-2.5">
                <div class="flex items-center justify-between px-1">
                  <h3 class="font-bold text-sm">${subj}</h3>
                  <span class="text-[11px] font-mono text-gray-400 uppercase">${files.length} FILES</span>
                </div>
                <div class="space-y-2">
                  ${files.map(file => `
                    <div class="bg-card border rounded-2xl p-4 flex items-center justify-between gap-3">
                      <div class="flex items-center gap-3 min-w-0">
                        <button onclick="toggleStarFile('${file.id}')" class="text-lg shrink-0">${file.starred ? '⭐' : '☆'}</button>
                        <div class="truncate">
                          <h4 class="font-semibold text-sm truncate">${file.title}</h4>
                          <p class="text-xs text-gray-500 font-mono mt-0.5">${file.type} • ${file.size}</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-2 shrink-0">
                        <button onclick="openInAppPdfViewer('${file.id}')" class="px-3.5 py-2 rounded-xl bg-[#245940] text-white text-xs font-semibold">
                          Preview
                        </button>
                        ${state.ownerMode ? `<button onclick="deleteFile('${file.id}')" class="text-xs text-red-500 hover:underline px-1">✕</button>` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </main>
      `;
    }

    function toggleStarFile(fileId) {
      const f = state.library.find(item => item.id === fileId);
      if (f) {
        f.starred = !f.starred;
        saveState();
        render();
      }
    }

    function deleteFile(fileId) {
      if (!state.ownerMode) return;
      state.library = state.library.filter(f => f.id !== fileId);
      saveState();
      showToast('File removed');
      render();
    }

    function openInAppPdfViewer(fileId) {
      const f = state.library.find(item => item.id === fileId);
      if (!f) return;
      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-card border rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-base">${f.title}</h3>
              <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <p class="text-xs font-mono text-[#2C6E49] dark:text-[#88B899]">${f.subject} • ${f.size}</p>
            <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">${f.summary}</p>
            <div class="flex justify-end gap-2">
              ${f.url && f.url !== '#' ? `<a href="${f.url}" target="_blank" class="px-4 py-2 rounded-xl border text-xs font-semibold">Open Original Link ↗</a>` : ''}
              <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-[#245940] text-white text-xs font-semibold">Close Reader</button>
            </div>
          </div>
        </div>
      `;
    }

        </div>
      `;
    }

    function confirmAddUniContent() {
      const title = document.getElementById('uni-title').value.trim();
      const desc = document.getElementById('uni-desc').value.trim();
      if (!title) return;
      state.uniContent[state.uniSubTab].unshift({ id: 'u_' + Date.now(), title, desc });
      state.notifications.unshift({
        id: 'n_' + Date.now(),
        title: `🔔 New in ${state.uniSubTab}: ${title}`,
        body: desc || 'Tap University tab to view details.',
        time: 'Just now',
        unread: true
      });
      saveState();
      closeModal();
      dispatchNativeNotification(`🔔 New in ${state.uniSubTab}`, `${title}: ${desc}`);
      render();
    }

    // ==========================================
    // MAIN RENDER
    // ==========================================
    function render() {
      applyTheme();
      const root = document.getElementById('app');

      if (state.onboardingStep === 'setup1') {
        root.innerHTML = renderSetupStep1();
        lucide.createIcons();
        return;
      }
      if (state.onboardingStep === 'setup2') {
        root.innerHTML = renderSetupStep2();
        lucide.createIcons();
        return;
      }

      let pageContent = '';
      if (state.activeTab === 'home') pageContent = renderHome();
      else if (state.activeTab === 'university') pageContent = renderUniversity();
      else if (state.activeTab === 'tasks') pageContent = renderTasks();
      else if (state.activeTab === 'calendar') pageContent = renderCalendar();
      else if (state.activeTab === 'library') pageContent = renderLibrary();
      else if (state.activeTab === 'settings') pageContent = renderSettings();

      root.innerHTML = `
        ${renderHeader()}
        ${pageContent}
        ${renderBottomNav()}
      `;
      lucide.createIcons();
    }

    initPwaAndServiceWorker();
    render();
  </script>
</body>
</html>
